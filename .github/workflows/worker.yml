name: webinar-mailer-worker

on:
  schedule:
    # Base: a cada 10 min. Cobre a confirmacao de novos cadastros e os emails
    # sem horario cravado (ter/qui/sex 09:00, qua 10:00, sex 20:00), que toleram alguns minutos.
    - cron: '*/10 * * * *'
    # Rajada de precisao: QUARTA, 15:00-18:59 UTC (~17:00-21:00 Berlim), a cada 5 min.
    # E a janela dos dois emails cravados no relogio: 18:30 ("comeca em 30 min") e 19:00 ("ao vivo").
    # Mais tentativas nessa faixa = mais chance de disparar perto do horario, apesar do jitter do GitHub.
    # 18:30 Berlim = 16:30 UTC (verao) / 17:30 UTC (inverno); 19:00 = 17:00 / 18:00 UTC. A faixa cobre os dois.
    - cron: '*/5 15-18 * * 3'
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

# Evita duas execucoes simultaneas (que poderiam mandar email duplicado).
concurrency:
  group: webinar-mailer-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Rodar worker
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AUTO_ROLLOVER: '0' # mude para '1' quando quiser ligar a renovacao semanal automatica
          SEND_DELAY_MS: '150'
        run: node dist/src/worker.js
