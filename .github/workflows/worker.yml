name: webinar-mailer-worker

on:
  schedule:
    # A cada 5 min (o intervalo minimo que o GitHub honra). Repo publico = minutos ilimitados.
    # OBS: o agendador do GitHub tem jitter de alguns minutos; nao e preciso ao segundo.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

# Evita duas execucoes simultaneas (que poderiam mandar email duplicado).
concurrency:
  group: webinar-mailer-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Rodar worker
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AUTO_ROLLOVER: '0' # mude para '1' quando quiser ligar a renovacao semanal automatica
          SEND_DELAY_MS: '150'
        run: node dist/src/worker.js
